[project]
name = "seo-observer"
version = "0.1.70"
description = "Evidence-first SEO observer CLI"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.0",
    "defusedxml>=0.7",
    "google-auth[requests]>=2.0,<2.41",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# PDF-рендер отчётов. Помимо пакета нужен браузер: `playwright install chromium`.
# Без него команды не падают — HTML остаётся, причина пишется в pdf_error.
pdf = [
    "playwright>=1.40",
]

[project.scripts]
seo-observer = "seo_observer.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
seo_observer = [
    "migrations/*.sql",
    "schemas/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
