name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Install pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
      - name: Scan new commits for secrets
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE_SHA" ]]; then
            base=$(git merge-base "$PR_BASE_SHA" HEAD)
          elif [[ -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            base="$PUSH_BEFORE"
          else
            base=$(git rev-parse HEAD^)
          fi
          /tmp/gitleaks-bin/gitleaks git --redact --no-banner --log-opts="$base..HEAD" .

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_manifests.py

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_hygiene.py
      - run: python3 scripts/check_doc_refs.py

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install every CLI package and smoke its entry points
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for pyproject in plugins/*/cli/pyproject.toml; do
            pkg_dir=$(dirname "$pyproject")
            echo "=== install $pkg_dir"
            uv tool install --quiet --force "$pkg_dir" || { failed=1; continue; }
            binaries=$(python3 -c "
          import sys, tomllib
          scripts = tomllib.load(open(sys.argv[1], 'rb'))['project'].get('scripts', {})
          print(' '.join(scripts))
          " "$pyproject")
            for binary in $binaries; do
              command -v "$binary" >/dev/null || { echo "MISSING binary: $binary"; failed=1; continue; }
              "$binary" --help >/dev/null 2>&1 || "$binary" --version >/dev/null 2>&1 \
                || { echo "SMOKE FAILED: $binary"; failed=1; }
            done
          done
          exit "$failed"
      - name: seo-observer doctor (no config)
        run: seo-observer doctor --json | python3 -c "import json,sys; assert json.load(sys.stdin)['ok']"
      - name: seo-hub end-to-end with minimal external registry
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          mkdir -p "$work/obs"
          cp plugins/seo-observer/examples/competitor-intelligence/project.toml "$work/obs/"
          cp -r plugins/seo-observer/examples/competitor-intelligence/keywords "$work/obs/"
          cat > "$work/registry.toml" <<'EOF'
          schema_version = 1
          data_dir = "./data"
          export_dir = "./exports"

          [[projects]]
          id = "example"
          label = "Example"
          observer_config = "obs/project.toml"
          EOF
          cd "$work"
          seo-hub doctor --config registry.toml --json > doctor.json 2> doctor.err || true
          rc=$?
          echo "doctor output:"; cat doctor.json; cat doctor.err
          python3 -c "import json; d=json.load(open('doctor.json')); assert d['ok'] and d['checks']['config']['status']=='ready', d"
          seo-hub run --config registry.toml --project example --mode full --json > run.json
          cat run.json
          python3 -c "
          import json
          payload = json.load(open('run.json'))
          sources = payload['run']['sources']
          assert sources['observer.doctor']['status'] == 'succeeded', sources
          assert sources['elmo.ai_visibility']['status'] == 'skipped', sources
          assert sources['openseo.evidence']['status'] == 'skipped', sources
          assert payload['run']['state'] in {'succeeded', 'partial'}, payload['run']['state']
          print('e2e ok:', payload['run']['state'])
          "
